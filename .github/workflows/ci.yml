name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (no Electron binary needed for tests)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium for the browser test
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$HOME/pw-browsers" npx playwright-core install chromium 2>/dev/null \
            || PLAYWRIGHT_BROWSERS_PATH="$HOME/pw-browsers" npx playwright@$(node -p "require('playwright-core/package.json').version") install chromium
          echo "KAI_TEST_CHROMIUM=$(find "$HOME/pw-browsers" -type f -name chrome -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"
        continue-on-error: true
      - name: Run tests
        run: npm test

  build-windows:
    # Installer builds are heavy: run on release tags (published to a GitHub
    # Release), on demand, or when a commit message opts in with [dist]
    # (artifacts only, nothing published).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dist]') || contains(github.event.head_commit.message, '[release]')
    # ALSO needs build-linux: both dist jobs racing `--publish always`
    # once created the same release simultaneously — linux won, windows
    # died on 422 already_exists and the release shipped half-empty
    # (v0.26.0 field finding). Serializing lets linux create, windows attach.
    needs: [test, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Code signing via Azure Trusted Signing — activates itself the moment
      # the AZURE_* secrets exist in the repo; absent secrets build exactly
      # as before (unsigned). No workflow edit needed on the day the cert
      # clears identity validation.
      - name: Enable code signing (when configured)
        shell: bash
        env:
          AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZ_PUBLISHER: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          if [ -n "$AZ_ACCOUNT" ] && [ -n "$AZ_PROFILE" ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.build.win.azureSignOptions = {
                codeSigningAccountName: process.env.AZ_ACCOUNT,
                certificateProfileName: process.env.AZ_PROFILE,
                endpoint: process.env.AZ_ENDPOINT || 'https://eus.codesigning.azure.net',
                ...(process.env.AZ_PUBLISHER ? { publisherName: process.env.AZ_PUBLISHER } : {}),
              };
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            "
            echo "Code signing ENABLED (Azure Trusted Signing: $AZ_ACCOUNT/$AZ_PROFILE)"
          else
            echo "Code signing not configured — building unsigned"
          fi
      - name: Build NSIS installer + portable exe
        run: npm run dist -- --win --publish ${{ (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: koinos-ai-windows
          path: |
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dist]') || contains(github.event.head_commit.message, '[release]')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # x64 AND arm64. The Raspberry Pi is an arm64 machine and there was
      # never a build for it: `--linux` on an x64 runner produces x86_64 only,
      # so a Pi had no AppImage it could even run, and electron-updater — which
      # looks for latest-linux-arm64.yml on that architecture — found nothing
      # and said nothing. Cross-building arm64 here works (verified: the packed
      # binary is a real ELF aarch64) and costs one extra Electron download.
      - name: Build AppImage (x64 + arm64)
        run: npm run dist -- --linux --x64 --arm64 --publish ${{ (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: koinos-ai-linux
          path: |
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  # ---------------------------------------------------------------- provenance
  #
  # FIND-SUP-001: a published installer said nothing about where it came from.
  #
  # The release carried a version tag and two binaries, and nothing tied one to
  # the other. Anyone downloading an AppImage had no way to establish that it
  # was built by this workflow, from this repository, at the commit the tag
  # claims — which is the whole question a supply-chain attack turns on, and
  # the one a tag alone cannot answer because a tag is just a name someone
  # wrote. Three things close that, and they answer different questions:
  #
  #   SHA256SUMS      is this the same file I was served?
  #   provenance      was it built here, from this commit, by this workflow?
  #   SBOM            what is inside it?
  #
  # Deliberately a SEPARATE job that runs AFTER both builds have published.
  # Attestation involves an OIDC exchange with GitHub's signing service, and if
  # that service is having a bad day it must not be able to stop a release
  # reaching testers. Failing here turns the run red — loudly, and worth
  # fixing — with the installers already out.
  provenance:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write      # attach SHA256SUMS and the SBOM to the release
      id-token: write      # OIDC token the attestation is signed against
      attestations: write  # record the attestation on the repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci

      # Both platforms' outputs, side by side, so one checksum file covers the
      # whole release rather than one per job that nobody can compare.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: koinos-ai-*
          merge-multiple: true

      - name: Checksums for every published binary
        run: |
          cd artifacts
          # The installers only. latest*.yml is electron-updater's own metadata
          # and already carries its own hashes; listing it here would invite
          # someone to check the wrong file.
          sha256sum *.exe *.AppImage > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      # npm's own SBOM: no extra action, no third-party tool in the release
      # path, and it reads the same lockfile the build installed from.
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx > artifacts/koinos-ai-sbom.cdx.json

      # Binds each artifact's digest to this repo, this commit and this
      # workflow run. Verifiable by anyone with:
      #   gh attestation verify <file> --repo therexdev/kaiapp
      - name: Attest the installers
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.AppImage

      - name: Attach the checksums and SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release upload "$TAG" \
            artifacts/SHA256SUMS \
            artifacts/koinos-ai-sbom.cdx.json \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached SHA256SUMS and the SBOM to $TAG"
