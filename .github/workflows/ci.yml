name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (no Electron binary needed for tests)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium for the browser test
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$HOME/pw-browsers" npx playwright-core install chromium 2>/dev/null \
            || PLAYWRIGHT_BROWSERS_PATH="$HOME/pw-browsers" npx playwright@$(node -p "require('playwright-core/package.json').version") install chromium
          echo "KAI_TEST_CHROMIUM=$(find "$HOME/pw-browsers" -type f -name chrome -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"
        continue-on-error: true
      - name: Run tests
        run: npm test

  build-windows:
    # Installer builds are heavy: run on release tags (published to a GitHub
    # Release), on demand, or when a commit message opts in with [dist]
    # (artifacts only, nothing published).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dist]') || contains(github.event.head_commit.message, '[release]')
    # ALSO needs build-linux: both dist jobs racing `--publish always`
    # once created the same release simultaneously — linux won, windows
    # died on 422 already_exists and the release shipped half-empty
    # (v0.26.0 field finding). Serializing lets linux create, windows attach.
    needs: [test, build-linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Code signing via Azure Trusted Signing — activates itself the moment
      # the AZURE_* secrets exist in the repo; absent secrets build exactly
      # as before (unsigned). No workflow edit needed on the day the cert
      # clears identity validation.
      - name: Enable code signing (when configured)
        shell: bash
        env:
          AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZ_PUBLISHER: ${{ secrets.AZURE_PUBLISHER_NAME }}
        run: |
          if [ -n "$AZ_ACCOUNT" ] && [ -n "$AZ_PROFILE" ]; then
            node -e "
              const fs = require('fs');
              const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              p.build.win.azureSignOptions = {
                codeSigningAccountName: process.env.AZ_ACCOUNT,
                certificateProfileName: process.env.AZ_PROFILE,
                endpoint: process.env.AZ_ENDPOINT || 'https://eus.codesigning.azure.net',
                ...(process.env.AZ_PUBLISHER ? { publisherName: process.env.AZ_PUBLISHER } : {}),
              };
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
            "
            echo "Code signing ENABLED (Azure Trusted Signing: $AZ_ACCOUNT/$AZ_PROFILE)"
          else
            echo "Code signing not configured — building unsigned"
          fi
      - name: Build NSIS installer + portable exe
        run: npm run dist -- --win --publish ${{ (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with:
          name: koinos-ai-windows
          path: |
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dist]') || contains(github.event.head_commit.message, '[release]')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # x64 AND arm64. The Raspberry Pi is an arm64 machine and there was
      # never a build for it: `--linux` on an x64 runner produces x86_64 only,
      # so a Pi had no AppImage it could even run, and electron-updater — which
      # looks for latest-linux-arm64.yml on that architecture — found nothing
      # and said nothing. Cross-building arm64 here works (verified: the packed
      # binary is a real ELF aarch64) and costs one extra Electron download.
      - name: Build AppImage (x64 + arm64)
        run: npm run dist -- --linux --x64 --arm64 --publish ${{ (startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[release]')) && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: koinos-ai-linux
          path: |
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error

  build-macos:
    # Keep release publication serialized across platforms. This job always
    # builds with --publish never and attaches assets only after macOS signing
    # and notarization have both been configured and validated.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[dist]') || contains(github.event.head_commit.message, '[release]')
    needs: [test, build-windows]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Chromium for macOS browser tests
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          npx playwright-core install chromium
          chromium=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f \( -name Chromium -o -name chrome \) -print -quit)
          test -x "$chromium"
          echo "KAI_TEST_CHROMIUM=$chromium" >> "$GITHUB_ENV"
      - name: Run tests on macOS
        run: npm test
      - name: Configure Developer ID signing and notarization when available
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$MAC_CSC_LINK" ] && [ -n "$MAC_CSC_KEY_PASSWORD" ] && [ -n "$APPLE_API_KEY_BASE64" ] && [ -n "$APPLE_API_KEY_ID_SECRET" ] && [ -n "$APPLE_API_ISSUER_SECRET" ]; then
            key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
            node -e "require('fs').writeFileSync(process.argv[1], Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64'))" "$key_path"
            chmod 600 "$key_path"
            echo "CSC_LINK=$MAC_CSC_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$MAC_CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"
            echo "MAC_RELEASE_READY=true" >> "$GITHUB_ENV"
            echo "Developer ID signing and notarization enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "MAC_RELEASE_READY=false" >> "$GITHUB_ENV"
            echo "Signing/notarization incomplete — producing CI artifacts only"
          fi
      - name: Build DMG + updater ZIP (Apple Silicon + Intel)
        run: npm run dist -- --mac --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate packaged architectures and updater metadata
        shell: bash
        run: |
          test -f dist/latest-mac.yml
          arm64_app=$(find dist -type d -name '*.app' -path '*arm64*' -print -quit)
          x64_app=$(find dist -type d -name '*.app' ! -path '*arm64*' -print -quit)
          test -n "$arm64_app"
          test -n "$x64_app"
          file "$arm64_app/Contents/MacOS/Koinos AI" | grep -q 'arm64'
          file "$x64_app/Contents/MacOS/Koinos AI" | grep -q 'x86_64'
          grep -q 'arm64' dist/latest-mac.yml
          grep -q 'x64' dist/latest-mac.yml
          (
            cd dist
            shasum -a 256 ./*.dmg ./*.zip ./latest-mac.yml ./*.blockmap > SHA256SUMS-macos.txt
          )
      - name: Validate signing, Gatekeeper, and notarization
        if: env.MAC_RELEASE_READY == 'true'
        shell: bash
        run: |
          while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=2 "$app"
            xcrun stapler validate "$app"
          done < <(find dist -mindepth 2 -maxdepth 2 -type d -name '*.app' -print0)
      - name: Upload macOS CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: koinos-ai-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
            dist/SHA256SUMS-macos.txt
          if-no-files-found: error
      - name: Attach signed and notarized assets to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && env.MAC_RELEASE_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml dist/SHA256SUMS-macos.txt --clobber
      - name: Refuse unsigned macOS publication
        if: startsWith(github.ref, 'refs/tags/v') && env.MAC_RELEASE_READY != 'true'
        run: echo "macOS assets were built and retained in CI, but were not published because signing/notarization is not fully configured."
