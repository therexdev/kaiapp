name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies (no Electron binary needed for tests)
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium for the browser test
        run: |
          PLAYWRIGHT_BROWSERS_PATH="$HOME/pw-browsers" npx playwright-core install chromium 2>/dev/null \
            || PLAYWRIGHT_BROWSERS_PATH="$HOME/pw-browsers" npx playwright@$(node -p "require('playwright-core/package.json').version") install chromium
          echo "KAI_TEST_CHROMIUM=$(find "$HOME/pw-browsers" -type f -name chrome -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"
        continue-on-error: true
      - name: Run tests
        run: npm test

  build-windows:
    # Installer builds are heavy; run on demand and on release tags.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build NSIS installer + portable exe
        run: npm run dist -- --win
      - uses: actions/upload-artifact@v4
        with:
          name: koinos-ai-windows
          path: |
            dist/*.exe
            dist/latest*.yml
          if-no-files-found: error

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build AppImage
        run: npm run dist -- --linux
      - uses: actions/upload-artifact@v4
        with:
          name: koinos-ai-linux
          path: |
            dist/*.AppImage
            dist/latest*.yml
          if-no-files-found: error
