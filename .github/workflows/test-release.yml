name: Test installers

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: kai-test-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Exact backend revision included in the server-first update directions.
  KAI_WALLET_BACKEND_COMMIT: daf2dc4cb19c84412f00d8552b348ebb4a8e0bd8

jobs:
  verify:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install Chromium
        run: |
          # ubuntu-latest already supplies Chromium runtime libraries (also used by CI).
          # Avoid refreshing unrelated OS package mirrors just to install the pinned browser.
          npx playwright-core install chromium
          echo "KAI_TEST_CHROMIUM=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')" >> "$GITHUB_ENV"
      - name: Audit application dependencies
        run: npm audit --audit-level=high
      - run: npm test
        env:
          KAI_MASCOT_QA_DIR: mascot-qa
          KAI_PREPAID_QA_DIR: mascot-qa
          # Tests provide their own loopback services. Never use production
          # defaults for background polls from temporary test profiles.
          KAI_SCHEDULER_URL: http://127.0.0.1:9/scheduler
          KAI_RELAY_URL: http://127.0.0.1:9
          KAI_FEEDBACK_URL: http://127.0.0.1:9/feedback
      - name: Check out the pinned credit scheduler for integrated acceptance
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai
          ref: ${{ env.KAI_WALLET_BACKEND_COMMIT }}
          path: verification-backend
          persist-credentials: false
      - name: Verify purchase, provider and paid reply together
        run: |
          npm ci --ignore-scripts --prefix verification-backend
          (cd verification-backend && node --test scripts/probe-koin-sponsorship-readiness.js deploy/koin-mainnet/update-free-allowance.test.js scripts/probe-koin-reward-summary.js scripts/probe-koin-reward-cycle.js scripts/probe-koin-epoch-completeness.js deploy/koin-mainnet/update-reward-summary.test.js)
          (cd verification-backend && node --test scripts/probe-wallet-credit-auth.js scripts/probe-wallet-credit-router.js scripts/probe-koin-provider-devices.js scripts/probe-koin-model-catalog.js scripts/probe-catalog-qualification.js scripts/probe-koin-on-demand-readiness.js scripts/probe-koin-qualification-preparation.js scripts/probe-koin-multi-model-readiness.js scripts/probe-koin-qualification-scheduling.js scripts/probe-koin-model-readiness.js scripts/probe-koin-device-free-auth.js scripts/probe-koin-device-free-router.js scripts/probe-koin-credit-priority.js scripts/probe-koin-purchase-journal.js scripts/probe-purchase-quotes-http.js deploy/koin-mainnet/update-wallet-access.test.js deploy/koin-mainnet/update-purchase-quotes.test.js deploy/koin-mainnet/update-provider-qualification.test.js deploy/koin-mainnet/update-model-readiness.test.js)
          node scripts/verify-credit-flow.js verification-backend
          node scripts/verify-provider-qualification.js verification-backend
          KAI_WALLET_BACKEND="$GITHUB_WORKSPACE/verification-backend" node --test core/test/wallet-first-integration.test.js core/test/device-free-backend.test.js
        env:
          KAI_SCHEDULER_URL: http://127.0.0.1:9/scheduler
          KAI_RELAY_URL: http://127.0.0.1:9
          KAI_FEEDBACK_URL: http://127.0.0.1:9/feedback
      - name: Check out the currently deployed credit service for compatibility
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai
          ref: cbdb3a581bf6b1e188379f18b99654a496626142
          path: verification-deployed-backend
          persist-credentials: false
      - name: Verify existing purchases and free-first chat before service upgrade
        run: |
          npm ci --ignore-scripts --prefix verification-deployed-backend
          node scripts/verify-credit-flow.js verification-deployed-backend --legacy-backend
        env:
          KAI_SCHEDULER_URL: http://127.0.0.1:9/scheduler
          KAI_RELAY_URL: http://127.0.0.1:9
          KAI_FEEDBACK_URL: http://127.0.0.1:9/feedback
      - name: Exercise real Docker node recovery and profile isolation
        run: node scripts/verify-node-supervisor-docker.js
      - name: Verify live network producer data
        run: node core/scripts/verify-network-producers.js
      - name: Verify producer signer Mainnet RPC
        run: node scripts/verify-producer-signer-network.js
      - name: Replay MCP Agent mode
        run: node core/scripts/verify-agent-loop.js
      - name: Verify Agent Network contract prototype
        working-directory: contracts/agent-network
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run build
      - name: Save Agent Network contract prototype
        uses: actions/upload-artifact@v4
        with:
          name: agent-network-contract-prototype
          path: |
            contracts/agent-network/build/release/*.wasm
            contracts/agent-network/build/*.wasm
            core/lib/agent-network/contract-abi.json
            docs/agent-network/*
          if-no-files-found: error
      - name: Verify KOIN custody contracts
        working-directory: contracts/koin-network
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm test
          npm run build
          node scripts/probe-runtime.js
      - name: Save KOIN custody contract build
        uses: actions/upload-artifact@v4
        with:
          name: koin-custody-contracts
          path: |
            contracts/koin-network/build/release/prepaid.wasm
            contracts/koin-network/build/release/prepaid-usd.wasm
            contracts/koin-network/build/release/credits.wasm
            contracts/koin-network/build/release/rewards.wasm
            contracts/koin-network/abi/*.json
            docs/koin-network/*
          if-no-files-found: error
      - name: Verify natural voice inference
        run: node scripts/verify-neural-voice.js
        env:
          KAI_MASCOT_QA_DIR: mascot-qa
      - name: Verify Pocket streaming voices
        run: node scripts/verify-pocket-voice.js
        env:
          KAI_MASCOT_QA_DIR: mascot-qa
      - name: Save KAI visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mascot-visual-checks
          path: mascot-qa/*
          if-no-files-found: ignore

  macos:
    runs-on: macos-latest
    # The serial browser suite now covers more than 1,750 cases. Preserve every
    # check while allowing for the observed hosted-runner timing variation.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install Chromium for macOS browser tests
        shell: bash
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pw-browsers"
          npx playwright-core install chromium
          chromium=$(node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())')
          test -x "$chromium"
          echo "KAI_TEST_CHROMIUM=$chromium" >> "$GITHUB_ENV"
      - name: Verify macOS app behavior
        # Browser fixtures share the macOS audio devices. Run files serially
        # and install Electron up front so Core cannot download it mid-test.
        run: node --test --test-concurrency=1 "core/test/*.test.js"
        env:
          KAI_SCHEDULER_URL: http://127.0.0.1:9/scheduler
          KAI_RELAY_URL: http://127.0.0.1:9
          KAI_FEEDBACK_URL: http://127.0.0.1:9/feedback

  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Check out the matching credit scheduler
        uses: actions/checkout@v4
        with:
          repository: therexdev/kai
          ref: ${{ env.KAI_WALLET_BACKEND_COMMIT }}
          path: verification-wallet-backend
          persist-credentials: false
      - run: npm ci --ignore-scripts --prefix verification-wallet-backend
      - name: Install the pinned browser and configure wallet-flow checks
        shell: pwsh
        run: |
          npx playwright-core install chromium
          $kaiChromium = node -e 'process.stdout.write(require("playwright-core").chromium.executablePath())'
          "KAI_TEST_CHROMIUM=$kaiChromium" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KAI_WALLET_BACKEND=$env:GITHUB_WORKSPACE\verification-wallet-backend" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify Windows wallet connection, payment and locked-wallet earning
        timeout-minutes: 12
        run: node --test --test-concurrency=1 core/test/wallet-credit-account.test.js core/test/provider-device.test.js core/test/credit-provider.test.js core/test/credit-purchases.test.js core/test/credit-purchase-progress.test.js core/test/koin-funding-approval.test.js core/test/koin-purchase-cancel.test.js core/test/koin-rpc-provider.test.js core/test/koin-chain.test.js core/test/koin-wallet-nonce.test.js core/test/local-chat-messages.test.js core/test/purchase-wallet.browser.test.js core/test/wallet-first-integration.test.js core/test/wallet-first-ui.browser.test.js core/test/credit-wallet-ipc.test.js core/test/purchase-connection.test.js core/test/session-free-chat.test.js core/test/koin-prepaid-chat.test.js core/test/koin-provider-status.test.js core/test/worker-proof.test.js core/test/worker-advertise.test.js core/test/worker-model-selection.test.js core/test/worker-preparation.test.js core/test/worker-start-stop.test.js core/test/worker-registration-retirement.test.js core/test/worker-qualification-diagnostics.test.js core/test/worker-qualification-delivery.test.js core/test/koin-work.test.js core/test/device-free-account.test.js core/test/device-free-backend.test.js core/test/wallet-credential-vault.test.js core/test/wallet-session-secret.test.js core/test/desktop-first-run.test.js core/test/guest-access-recovery.test.js core/test/credit-guest-recovery.test.js core/test/provider-setup-ui.browser.test.js core/test/reward-feed.browser.test.js core/test/update-restart.test.js
        env:
          KAI_SCHEDULER_URL: http://127.0.0.1:9/scheduler
          KAI_RELAY_URL: http://127.0.0.1:9
          KAI_FEEDBACK_URL: http://127.0.0.1:9/feedback
      - name: Verify smooth credit, wallet and earning controls
        timeout-minutes: 5
        run: node --test --test-concurrency=1 core/test/credit-account.test.js core/test/credit-visibility.browser.test.js core/test/provider-smooth.browser.test.js core/test/provider-switches.browser.test.js core/test/payment-wallet.browser.test.js
        env:
          KAI_SCHEDULER_URL: http://127.0.0.1:9/scheduler
          KAI_RELAY_URL: http://127.0.0.1:9
          KAI_FEEDBACK_URL: http://127.0.0.1:9/feedback
      - name: Test Windows signature rejection paths
        run: node --test core/test/windows-signing.test.js core/test/windows-signing-preparation.test.js
      - name: Verify Windows long-profile payment journal recovery
        run: node --test core/test/koin-windows-journals.test.js
      - name: Build fast Windows voice helper
        run: node scripts/build-windows-voice.js
      - name: Build private desktop control helper
        run: node scripts/build-windows-computer.js
      - name: Verify real Windows browser control
        run: node scripts/verify-computer-control.js
      - name: Verify fast Windows voices and character effects
        run: node scripts/verify-windows-voice.js
        env:
          KAI_MASCOT_QA_DIR: windows-voice-qa
      - name: Save fast voice checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-windows-voice-checks
          path: windows-voice-qa/*
          if-no-files-found: ignore
      - name: Prepare test installer identity
        run: node scripts/prepare-test-build.js ${{ github.run_number }} ${{ github.run_attempt }}
      - name: Verify live profile handoff and credential reuse
        run: node scripts/verify-shared-profile.js
      - name: Verify native KAI companion
        run: node scripts/verify-mascot-window.js
      - name: Verify real Windows wake recognition
        run: node scripts/verify-wake-voice.js
      - name: Build Windows preflight package
        run: npm run dist -- --win --dir --publish never
      - name: Verify Windows preflight contents
        run: node scripts/verify-test-package.js --preflight
      - name: Verify packaged Pocket voices
        run: node scripts/verify-pocket-voice.js --packaged
        env:
          KAI_MASCOT_QA_DIR: pocket-voice-qa
      - name: Save packaged Pocket checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-windows-voice-checks
          path: pocket-voice-qa/*
          if-no-files-found: ignore
      - name: Verify packaged fast Windows voices
        run: node scripts/verify-windows-voice.js --packaged
      - name: Verify packaged desktop control
        run: node scripts/verify-computer-control.js --packaged
      - name: Verify packaged voice recovery with native DLL unavailable
        run: node scripts/verify-neural-voice.js --packaged --without-native
      - name: Prepare and verify Windows signing module
        run: ./scripts/prepare-windows-signing.ps1
      - name: Require Azure signing and pin the existing publisher
        run: node scripts/configure-windows-signing.js
        env:
          AZ_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZ_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZ_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - name: Build Windows test installers
        # Discard unsigned preflight output before building the signed package.
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          npm run dist -- --win --publish never
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      - run: node scripts/verify-test-package.js
      - name: Verify packaged Windows natural voices
        run: node scripts/verify-neural-voice.js --packaged
      - name: Verify Windows signatures, timestamps and publisher before upload
        run: node scripts/verify-windows-signatures.js dist
      - name: Verify packaged wallet and device credentials across a native restart
        run: node scripts/verify-wallet-device-storage.js --app-dir dist/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: kai-test-windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/test*.yml
            dist/windows-signatures-*.json
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Verify Linux update restart and shared profile handoff
        run: xvfb-run -a node scripts/verify-linux-relaunch.js
      - name: Prepare test installer identity
        run: node scripts/prepare-test-build.js ${{ github.run_number }} ${{ github.run_attempt }}
      - run: npm run dist -- --linux --x64 --publish never
      - run: node scripts/verify-test-package.js
      - name: Verify packaged Linux AppImage installation and restart
        timeout-minutes: 5
        run: xvfb-run -a node scripts/verify-linux-relaunch.js --app-dir dist/linux-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: kai-test-linux
          path: |
            dist/*.AppImage
            dist/test*.yml
          if-no-files-found: error

  linux-arm64-native:
    # Publish the same native ARM64 package used by credential/restart acceptance.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      KAI_SCHEDULER_URL: http://127.0.0.1:9/scheduler
      KAI_RELAY_URL: http://127.0.0.1:9
      KAI_FEEDBACK_URL: http://127.0.0.1:9/feedback
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require native Linux ARM64 and the reviewed backend
        run: node -e 'if (process.platform !== "linux" || process.arch !== "arm64" || !/^[a-f0-9]{40}$/.test(process.env.KAI_WALLET_BACKEND_COMMIT)) throw Error("Native ARM64 and an exact backend revision are required")'
      - uses: actions/checkout@v4
        with:
          repository: therexdev/kai
          ref: ${{ env.KAI_WALLET_BACKEND_COMMIT }}
          path: verification-wallet-backend
          persist-credentials: false
      - name: Install native display and disposable keyring dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gnome-keyring libsecret-1-0 xvfb xauth dbus-x11 libglib2.0-bin xdg-user-dirs libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: npm ci
      - run: npm ci --ignore-scripts --prefix verification-wallet-backend
      - name: Verify ARM64 wallet, earning, launcher and backend integration
        run: node --test core/test/wallet-credit-account.test.js core/test/provider-device.test.js core/test/session-free-chat.test.js core/test/credit-wallet-ipc.test.js core/test/purchase-connection.test.js core/test/credit-purchase-progress.test.js core/test/local-chat-messages.test.js core/test/koin-windows-journals.test.js core/test/linux-shortcut.test.js core/test/linux-shortcut-auto.test.js core/test/update-restart.test.js core/test/worker-preparation.test.js core/test/worker-model-selection.test.js core/test/worker-qualification-diagnostics.test.js core/test/worker-qualification-delivery.test.js core/test/koin-work.test.js core/test/device-free-account.test.js core/test/device-free-backend.test.js core/test/wallet-credential-vault.test.js core/test/wallet-session-secret.test.js core/test/desktop-first-run.test.js core/test/guest-access-recovery.test.js core/test/credit-guest-recovery.test.js core/test/koin-provider-status.test.js core/test/credit-provider.test.js core/test/wallet-first-integration.test.js
        env:
          KAI_WALLET_BACKEND: ${{ github.workspace }}/verification-wallet-backend
      - name: Verify native ARM64 relaunch and shared profile exclusion
        run: xvfb-run -a node scripts/verify-linux-relaunch.js
      - name: Prepare separate Test package identity
        run: node scripts/prepare-test-build.js ${{ github.run_number }} ${{ github.run_attempt }}
      - name: Build ARM64 AppImage for native verification
        run: npm run dist -- --linux --arm64 --publish never
      - name: Verify ARM64 package content and architecture
        run: |
          node scripts/verify-test-package.js
          node -e 'const b=require("fs").readFileSync("dist/linux-arm64-unpacked/koinos-ai-test"); if(b.subarray(0,4).toString("hex")!=="7f454c46" || b[4]!==2 || b[5]!==1 || b.readUInt16LE(18)!==183) throw Error("Packaged executable is not little-endian ELF64 AArch64")'
      - name: Verify packaged ARM64 AppImage installation and restart
        timeout-minutes: 5
        run: xvfb-run -a node scripts/verify-linux-relaunch.js --app-dir dist/linux-arm64-unpacked
        env:
          KAI_NATIVE_QA_DIR: wallet-flow-qa
      - name: Verify packaged Secret Service, wallet vault and free startup on ARM64
        timeout-minutes: 5
        run: xvfb-run -a node scripts/verify-linux-wallet-storage.js --app-dir dist/linux-arm64-unpacked
        env:
          KAI_NATIVE_QA_DIR: wallet-flow-qa
      - name: Save verified native ARM64 installer and feed
        uses: actions/upload-artifact@v4
        with:
          name: kai-test-linux-arm64
          path: |
            dist/*.AppImage
            dist/test-linux-arm64.yml
          if-no-files-found: error
      - name: Record native ARM64 verification identities
        run: |
          mkdir -p wallet-flow-qa
          node -e 'require("fs").writeFileSync("wallet-flow-qa/test-arm64-verification.json",JSON.stringify({desktop:process.env.GITHUB_SHA,backend:process.env.KAI_WALLET_BACKEND_COMMIT,run:process.env.GITHUB_RUN_ID,platform:process.platform,arch:process.arch,published:false,physicalPi:false},null,2)+"\n")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wallet-flow-native-arm64-evidence
          path: wallet-flow-qa/*.json
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [windows, linux, macos, linux-arm64-native]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - uses: actions/download-artifact@v4
        with:
          pattern: kai-test-*
          path: artifacts
          merge-multiple: true
      - name: Publish test installers and isolated update feeds
        run: node scripts/publish-test-build.js artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
