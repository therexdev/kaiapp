name: Netcheck

# Read-only probe of the live network, run where egress is open. Sandboxed
# dev sessions can't always reach koinosai.com directly, so this dispatch-only
# job prints the public status feeds into the job log — live evidence on
# demand. It changes nothing anywhere.

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]

jobs:
  netcheck:
    # Push-triggered only when the commit message opts in with [netcheck]
    # (same pattern as [bench] / [pin-verify]); dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[netcheck]')
    runs-on: ubuntu-latest
    steps:
      - name: Public network status
        run: |
          echo "== /scheduler/network/status =="
          curl -sS --max-time 30 https://koinosai.com/scheduler/network/status | python3 -m json.tool
          echo
          echo "== /scheduler/network/models =="
          curl -sS --max-time 30 https://koinosai.com/scheduler/network/models | python3 -m json.tool
          echo
          echo "== website =="
          curl -sS --max-time 30 -o /dev/null -w 'koinosai.com HTTP %{http_code} in %{time_total}s\n' https://koinosai.com/
