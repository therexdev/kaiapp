name: Netcheck

# Read-only probe of the live network, run where egress is open. Sandboxed
# dev sessions can't always reach koinosai.com directly, so this dispatch-only
# job prints the public status feeds into the job log — live evidence on
# demand. It changes nothing anywhere.

on:
  workflow_dispatch:
  push:
    branches: ["main", "claude/**"]

jobs:
  # One-shot pin of the gemma3-4b vision projector (§27 identity-by-hash):
  # streams the mmproj from HF on the runner and prints its sha256/size.
  # Trigger with [pin-vision] in the commit message; paste the printed JSON
  # into catalog.json (mmproj block) and set "vision": true in that commit.
  pinvision:
    if: contains(github.event.head_commit.message, '[pin-vision]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node core/scripts/pin-model.js google_gemma-3-4b-it-q4_k_m@1 --mmproj-only
  netcheck:
    # Push-triggered only when the commit message opts in; dispatch always
    # runs. [armcheck] and [pricecheck] are STEPS inside this job, so the job
    # gate has to accept them too — a commit tagged [pricecheck] alone once
    # skipped the whole job and silently ran nothing.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.head_commit.message, '[netcheck]')
      || contains(github.event.head_commit.message, '[pricecheck]')
      || contains(github.event.head_commit.message, '[armcheck]')
      || contains(github.event.head_commit.message, '[chaincheck]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: contains(github.event.head_commit.message, '[chaincheck]')
      - name: Koinos RPC + DEX probe (chain constants live in kai lib/chain.js)
        if: contains(github.event.head_commit.message, '[chaincheck]')
        run: |
          # Pin to the version the APP declares, not whatever the registry
          # currently calls latest. Both probes compare what the chain resolves
          # against what the app has vendored, and that comparison only means
          # something if both sides read the chain through the same library.
          # Installing "latest" also made every run do a fresh registry
          # resolution — the source of the 03:41Z hang and of routine 2.5-4
          # minute step times on a step whose actual work takes two seconds.
          # From the LOCKFILE, not the package.json range: "^9.3.0" still
          # floats (it resolves to 9.4.0 today) and would put the probe on a
          # different build of koilib than the app actually ships, which is
          # exactly the difference this comparison is supposed to be blind to.
          KOILIB=$(node -p "require('./package-lock.json').packages['node_modules/koilib'].version")
          npm i --no-save --prefer-offline --no-audit --no-fund "koilib@$KOILIB" >/dev/null 2>&1
          node core/scripts/chain-probe.js
      - name: Public network status
        run: |
          # Tolerant: never abort on the first slow endpoint — probe ALL of
          # them so a scheduler hang can be told apart from a whole-site
          # outage. Each line prints its own HTTP code + timing.
          set +e
          echo "== reachability (code / time) =="
          curl -sS --max-time 15 -o /dev/null -w 'root       HTTP %{http_code} in %{time_total}s\n' https://koinosai.com/
          curl -sS --max-time 15 -o /dev/null -w '/network   HTTP %{http_code} in %{time_total}s\n' https://koinosai.com/network
          curl -sS --max-time 15 -o /dev/null -w 'sched/stat HTTP %{http_code} in %{time_total}s\n' https://koinosai.com/scheduler/network/status
          curl -sS --max-time 15 -o /dev/null -w 'sched/heal HTTP %{http_code} in %{time_total}s\n' https://koinosai.com/api/health
          echo
          echo "== origin fingerprint (which server is answering) =="
          # After the Vultr cutover the origin is Caddy answering directly
          # (Server: Caddy); the old Hostinger path fronted the app with a CDN
          # (hstgr / LiteSpeed headers). This tells the two apart at a glance.
          curl -sS --max-time 15 -D - -o /dev/null https://koinosai.com/ \
            | grep -iE '^(server|via|x-served-by|x-powered-by|cf-ray|platform):' \
            || echo "(no identifying headers)"
          echo
          echo "== /api/health (restart forensics) =="
          curl -sS --max-time 15 https://koinosai.com/api/health | python3 -m json.tool || echo "(health unreachable)"
          echo
          # Payout roster consumed by Free Koinos Node: FULL addresses of
          # providers serving right now. `count` must track workersOnline in
          # the status block below (one shared liveness rule), and no entry
          # may contain "…" — a truncated address is not payable.
          echo "== /scheduler/network/roster (Free Koinos Node payout list) =="
          curl -sS --max-time 15 -D /tmp/roster.h https://koinosai.com/scheduler/network/roster -o /tmp/roster.json \
            && grep -i '^cache-control:' /tmp/roster.h \
            && python3 -c "import json;d=json.load(open('/tmp/roster.json'));w=d.get('workers',[]);print('count:',d.get('count'),'len:',len(w));print('truncated entries:',sum(1 for a in w if '\u2026' in a));print('unique:',len(set(w))==len(w));print(json.dumps(w[:5],indent=2))" \
            || echo "(roster endpoint unreachable or not deployed yet)"
          echo
          echo "== /scheduler/network/status body =="
          curl -sS --max-time 15 https://koinosai.com/scheduler/network/status | python3 -m json.tool || echo "(status endpoint unreachable)"
          echo
          # §51 oracle state: `status` should read anchor (no feeds), live (feeds
          # answering), or stale-hold (all feeds down, holding last price — NOT a
          # snap back to the anchor). `usd` walks toward the market by at most
          # maxStepPct per epoch; a jump larger than that means a breaker failed.
          echo "== /scheduler/pricing -> oracle block =="
          curl -sS --max-time 15 https://koinosai.com/scheduler/pricing \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('oracle', '(no oracle block — old build?)'), indent=2))" \
            || echo "(pricing endpoint unreachable)"
          echo
          # Claim packets + per-epoch settlement outcome (live since the kai
          # production merge 3205141). settlement.error on recent epochs is
          # THE diagnosis for roots quietly not landing on the testnet
          # contract; proofs are elided here — the digest below checks them.
          # Tester docs (kai public/docs): the shell, one content page, and one
          # SCREENSHOT must all serve — a docs deploy that loses its images
          # shows up here instead of in an angry field report.
          echo "== /docs (tester documentation) =="
          curl -sS --max-time 15 -o /dev/null -w 'docs shell  HTTP %{http_code} (%{size_download} bytes)\n' https://koinosai.com/docs/
          curl -sS --max-time 15 -o /dev/null -w 'docs page   HTTP %{http_code} (%{size_download} bytes)\n' https://koinosai.com/docs/content/earn.md
          curl -sS --max-time 15 -o /dev/null -w 'docs image  HTTP %{http_code} (%{size_download} bytes)\n' https://koinosai.com/docs/img/earn.png
          # The developer-track additions (v0.29.0 docs deploy): the newest
          # page and its screenshot — a partial docs deploy shows up here.
          curl -sS --max-time 15 -o /dev/null -w 'docs kcode  HTTP %{http_code} (%{size_download} bytes)\n' https://koinosai.com/docs/content/koinos-code.md
          curl -sS --max-time 15 -o /dev/null -w 'docs devimg HTTP %{http_code} (%{size_download} bytes)\n' https://koinosai.com/docs/img/api-dev.png
          echo
          # The web app (/app). Anonymous, this MUST redirect — a 200 here
          # would mean the gated shell is being served to the open internet,
          # which is the one failure mode the whole views/-not-public/ design
          # exists to prevent. A 404 means the deploy has not landed yet.
          echo "== /app (web app shell — must be gated, never 200) =="
          curl -sS --max-time 15 -o /tmp/app.body -w 'app        HTTP %{http_code} -> %{redirect_url}\n' https://koinosai.com/app
          grep -q 'id="view-gate"' /tmp/app.body && echo "LEAK: the shell body served to an anonymous caller" || echo "shell body not served anonymously (correct)"
          curl -sS --max-time 15 -o /dev/null -w 'app/app.js HTTP %{http_code} (%{size_download} bytes)\n' https://koinosai.com/app/app.js
          curl -sS --max-time 15 https://koinosai.com/robots.txt | grep -q '^Disallow: /app$' \
            && echo "robots.txt disallows /app" || echo "robots.txt does NOT disallow /app"
          # Its API must be gated too, and answer JSON — a browser gets a door,
          # an API caller gets a status it can read.
          curl -sS --max-time 15 -o /tmp/appapi.body -w 'api/chats  HTTP %{http_code}\n' https://koinosai.com/app/api/chats
          head -c 120 /tmp/appapi.body; echo
          # The newest docs page. A partial docs deploy shows up here BEFORE
          # the freshness marker below is moved onto it.
          curl -sS --max-time 15 -o /dev/null -w 'docs webapp HTTP %{http_code} (%{size_download} bytes)\n' https://koinosai.com/docs/content/web-app.md
          echo
          echo "== /scheduler/claims (settlement diagnosis) =="
          curl -sS --max-time 15 "https://koinosai.com/scheduler/claims?address=1EXvuuW5HMrYRPdkraSi5Z4TBd4djyMj6E&limit=8" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); [c.pop('proof', None) for c in d.get('claims', [])]; print(json.dumps(d, indent=2))" \
            || echo "(claims endpoint unreachable or not deployed)"
          echo
          exit 0
      - uses: actions/checkout@v4
      - name: Health digest (assertions run HERE, not in a reader's head)
        # The raw dumps above are for forensics. This step does the actual
        # scheduled-stability assertions on the runner and prints ~25 lines,
        # so a check is read at a glance instead of by scrolling 300 lines of
        # JSON. STATE lines carry the values worth diffing between checks.
        # The digest asks the GitHub API whether the release actually carries
        # the installers the /testers page offers. Anonymous API access is 60
        # requests/hour PER IP, shared across Actions runners, and it duly ran
        # out and reported a FAIL for downloads it had simply been unable to
        # check. The workflow's own token raises that ceiling and costs
        # nothing; it is read-only and scoped to this repository.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/health-digest.py
      - name: ARM64 engine availability (Pi support — runtime catalog candidates)
        if: contains(github.event.head_commit.message, '[armcheck]')
        run: |
          set +e
          echo "== llama.cpp b10423 assets mentioning ubuntu/arm =="
          curl -sS --max-time 20 "https://api.github.com/repos/ggml-org/llama.cpp/releases/tags/b10423" \
            | python3 -c "import json,sys; [print(a['name'], a['size']) for a in json.load(sys.stdin).get('assets',[]) if 'ubuntu' in a['name'] or 'arm' in a['name']]"
          echo "== ubuntu-arm64 tarball contents (binPath discovery) =="
          curl -sSL --max-time 60 -o /tmp/arm.tgz "https://github.com/ggml-org/llama.cpp/releases/download/b10423/llama-b10423-bin-ubuntu-arm64.tar.gz" \
            && tar -tzf /tmp/arm.tgz | head -30
          echo "== ubuntu-x64 tarball contents =="
          curl -sSL --max-time 60 -o /tmp/x64.tgz "https://github.com/ggml-org/llama.cpp/releases/download/b10423/llama-b10423-bin-ubuntu-x64.tar.gz" \
            && tar -tzf /tmp/x64.tgz | head -30
          echo
          exit 0
      - name: Price-feed formats (oracle rehearsal candidates)
        if: contains(github.event.head_commit.message, '[pricecheck]')
        run: |
          set +e
          # ON-CHAIN price from the vKOIN/USDT pool with the deepest liquidity
          # (owner-specified primary market): read the SAME Ethereum pool via two
          # independent aggregators for median-of-two redundancy. Confirm which
          # priceUsd field is the ~$0.04 vKOIN side (base vs quote).
          ADDR=0xa50ad3a559a10f384a5bb2e27516f63e0b937b1a  # vKOIN token on ETH
          echo "== dexscreener tokens/ADDR (path: pairs.0.priceUsd) =="
          curl -sS --max-time 20 "https://api.dexscreener.com/latest/dex/tokens/$ADDR" | head -c 900
          echo; echo "== geckoterminal eth/tokens/ADDR (attributes.price_usd) =="
          curl -sS --max-time 20 "https://api.geckoterminal.com/api/v2/networks/eth/tokens/$ADDR" | head -c 700
          echo
          exit 0

  # Voice input groundwork: discover the real whisper.cpp Windows release
  # asset (name drifts across tags), hash engine + model for catalog pinning,
  # and run a REAL transcription on the shipping OS — the full E2E the
  # sandbox can't do. Output feeds core/runtimes/catalog.json's whisper entry.
  # Read-only balance/metadata lookup for ONE public mainnet address, when the
  # node's log and the app's balance disagree about the same wallet. Its own
  # job so the answer IS the log, instead of forty lines buried in nine hundred.
  vhpcheck:
    if: contains(github.event.head_commit.message, '[vhpcheck:')
    runs-on: ubuntu-latest
    # A hung probe is worse than a failed one. This job reads a wallet over a
    # public RPC with no timeout of its own, and on 2026-09-04 03:41Z it stuck
    # on a step that normally takes ten seconds. Left alone it would have held
    # a runner for GitHub's default six hours — but the real damage is that an
    # unfinished run is invisible: the next check looks for the newest
    # COMPLETED netcheck run, finds the previous window's, and reads balances
    # that are four hours stale as if they were current. A silent stall in the
    # thing that watches for silent stalls. Fail fast and loudly instead.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: VHP truth probe
        run: |
          # Pin to the version the APP declares, not whatever the registry
          # currently calls latest. Both probes compare what the chain resolves
          # against what the app has vendored, and that comparison only means
          # something if both sides read the chain through the same library.
          # Installing "latest" also made every run do a fresh registry
          # resolution — the source of the 03:41Z hang and of routine 2.5-4
          # minute step times on a step whose actual work takes two seconds.
          # From the LOCKFILE, not the package.json range: "^9.3.0" still
          # floats (it resolves to 9.4.0 today) and would put the probe on a
          # different build of koilib than the app actually ships, which is
          # exactly the difference this comparison is supposed to be blind to.
          KOILIB=$(node -p "require('./package-lock.json').packages['node_modules/koilib'].version")
          npm i --no-save --prefer-offline --no-audit --no-fund "koilib@$KOILIB" >/dev/null 2>&1
          ADDR=$(printf '%s' "${{ github.event.head_commit.message }}" | grep -oE '\[vhpcheck:[a-zA-Z0-9]+\]' | head -1 | sed 's/\[vhpcheck://; s/\]//')
          # A commit that merely DESCRIBES this job carries the tag in its prose
          # and lands here with nothing to probe. That is not a broken build —
          # it is someone writing a sentence — so say so and stop, rather than
          # painting the run red and training everyone to ignore it.
          if [ -z "$ADDR" ]; then
            echo "::notice::[vhpcheck] no address to probe — the tag appears in prose, not as [vhpcheck:<koinos-address>]. Nothing to do."
            exit 0
          fi
          node core/scripts/vhp-probe.js "$ADDR"

  # Can llama-server verify a draft it did not write? The gating question for
  # docs/DECENTRALIZED-INFERENCE.md Phase 1 — speculative decoding across the
  # network boundary only works if one forward pass can score k supplied
  # tokens. Runs here because the dev sandbox reaches neither huggingface.co
  # nor the llama.cpp releases. Read-only, nothing published.
  speccheck:
    if: contains(github.event.head_commit.message, '[speccheck]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Fetch llama.cpp + a tiny model
        env:
          # Unauthenticated api.github.com is 60 requests/hour PER IP and
          # Actions runners share IPs.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # NO `set -e` here, and that is the entire point. GitHub already runs
          # this step as `bash -e`, which aborts on the first failing command —
          # including an assignment whose command substitution fails. Two
          # earlier attempts died in 0.2 seconds with no output at all, because
          # `URL=$(grep ... )` finding nothing killed the shell BEFORE the
          # careful diagnostics written to explain it. Every failure below is
          # reported by an explicit check, never by the shell exiting.
          set +e
          mkdir -p /tmp/lc && cd /tmp/lc

          # NOT releases/latest. That endpoint skips prereleases, and for
          # llama.cpp it returns a release tagged v0.2.0 whose only asset is
          # nightly-tag.txt — the actual binary builds live under bNNNN tags
          # it does not consider "latest". Take the LIST and pick the newest
          # release that actually carries a linux x64 build.
          CODE=$(curl -sSL -w '%{http_code}' -o rel.json \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -H "Accept: application/vnd.github+json" \
                 'https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=15')
          echo "releases API: HTTP $CODE, $(wc -c < rel.json) bytes"

          # Print EVERY linux-ish asset before choosing, so a filter that
          # matches nothing is a readable list rather than another silent zero.
          node -e '
            const rel = JSON.parse(require("fs").readFileSync("rel.json","utf8"));
            if (!Array.isArray(rel)) { console.log("API did not return a list:", JSON.stringify(rel).slice(0,300)); process.exit(0); }
            console.log("tags:", rel.map(r => r.tag_name).join(" "));
            for (const r of rel.slice(0, 3))
              for (const x of (r.assets || []))
                if (/linux|ubuntu/i.test(x.name)) console.log("  " + r.tag_name + "  " + x.name);
          '
          URL=$(node -e '
            const rel = JSON.parse(require("fs").readFileSync("rel.json","utf8"));
            if (!Array.isArray(rel)) process.exit(0);
            const linux = (x) => /linux|ubuntu/i.test(x.name) && /(x64|amd64)/i.test(x.name) && /\.(zip|tar\.gz)$/i.test(x.name);
            // A CPU runner cannot use the accelerator builds; prefer a plain
            // one, but take an accelerated build over nothing — llama.cpp
            // falls back to CPU when the device is absent.
            const plain = (x) => !/(cuda|vulkan|sycl|hip|rocm|openvino|musa|cann|arm64|aarch64)/i.test(x.name);
            for (const pass of [plain, () => true])
              for (const r of rel)
                for (const x of (r.assets || []))
                  if (linux(x) && pass(x)) {
                    console.error("chose " + r.tag_name + " / " + x.name);
                    console.log(x.browser_download_url);
                    process.exit(0);
                  }
          ')
          if [ -z "$URL" ]; then
            echo "::error::no linux x64 archive in the last 15 llama.cpp releases — see the asset list above"
            exit 1
          fi
          echo "build: $URL"

          case "$URL" in *.tar.gz) EXT=tar.gz ;; *) EXT=zip ;; esac
          curl -sSL -f -o "lc.$EXT" "$URL"
          if [ $? -ne 0 ] || [ ! -s "lc.$EXT" ]; then echo "::error::build download failed"; exit 1; fi
          mkdir -p build
          if [ "$EXT" = "zip" ]; then unzip -q lc.zip -d build; else tar -xzf lc.tar.gz -C build; fi
          find build -name 'llama-server' -type f -exec chmod +x {} \;
          SERVER=$(find build -name 'llama-server' -type f | head -1)
          if [ -z "$SERVER" ]; then
            echo "::error::no llama-server binary inside the release zip"
            find build -maxdepth 3 -type f | head -40
            exit 1
          fi
          echo "server: $SERVER"

          GOT=""
          for M in \
            "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories260K.gguf" \
            "https://huggingface.co/ggml-org/models/resolve/main/tinyllamas/stories15M-q4_0.gguf" \
            "https://huggingface.co/ggml-org/stories15M_MOE/resolve/main/stories15M_MOE-F16.gguf" ; do
            C=$(curl -sSL -w '%{http_code}' -o model.gguf "$M")
            echo "  $C  $M  ($(wc -c < model.gguf 2>/dev/null || echo 0) bytes)"
            if [ "$C" = "200" ] && [ -s model.gguf ]; then GOT="$M"; break; fi
          done
          if [ -z "$GOT" ]; then
            echo "::error::no tiny model could be fetched — see the status codes above"
            exit 1
          fi
          echo "model: $GOT"
          ls -la model.gguf
      - name: Probe
        run: |
          SERVER=$(find /tmp/lc/build -name llama-server -type f | head -1)
          echo "server: $SERVER"
          node core/scripts/spec-decode-probe.js "$SERVER" /tmp/lc/model.gguf

  voicecheck:
    if: contains(github.event.head_commit.message, '[voicecheck]')
    runs-on: windows-latest
    steps:
      - name: Whisper engine + model discovery and E2E
        shell: bash
        run: |
          set +e
          echo "== whisper.cpp latest release =="
          REL=$(curl -sS --max-time 30 https://api.github.com/repos/ggml-org/whisper.cpp/releases/latest)
          echo "$REL" | python3 -c "import json,sys; r=json.load(sys.stdin); print('tag:', r['tag_name']); [print(a['name'], a['size']) for a in r['assets']]"
          URL=$(echo "$REL" | python3 -c "import json,sys; r=json.load(sys.stdin); c=[a['browser_download_url'] for a in r['assets'] if 'x64' in a['name'].lower() and a['name'].endswith('.zip') and 'cu' not in a['name'].lower() and 'blas' not in a['name'].lower()]; print(c[0] if c else '')")
          echo "chosen asset: $URL"
          [ -z "$URL" ] && { echo "NO x64 CPU ZIP FOUND — see asset list above"; exit 0; }
          curl -sSL --max-time 300 -o w.zip "$URL"
          echo "engine zip sha256/size:"; sha256sum w.zip; stat -c %s w.zip
          unzip -q w.zip -d weng
          echo "== zip contents (binPath discovery) =="
          (cd weng && find . -type f | head -40)
          # whisper-cli.exe ONLY — main.exe is a deprecation shim that exits 1
          # without transcribing (first-run finding: find's -o picked it).
          BIN=$(find weng -iname "whisper-cli.exe" | head -1)
          echo "binary: $BIN"
          echo "== model ggml-base.en.bin =="
          curl -sSL --max-time 300 -o model.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin"
          echo "model sha256/size:"; sha256sum model.bin; stat -c %s model.bin
          echo "== E2E: transcribe a generated 16k wav on windows =="
          python3 -c "import wave,struct,math; w=wave.open('test.wav','wb'); w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000); [w.writeframes(struct.pack('<h', int(3000*math.sin(i*2*math.pi*440/16000)))) for i in range(32000)]; w.close()"
          "$BIN" -m model.bin -f test.wav --no-timestamps
          echo "engine exit: $?"
          echo "== ubuntu tarball contents (future Linux voice binPath discovery) =="
          curl -sSL --max-time 60 -o wu.tgz "https://github.com/ggml-org/whisper.cpp/releases/download/v1.9.2/whisper-bin-ubuntu-x64.tar.gz" && tar -tzf wu.tgz | head -25
          exit 0

  # Proves the "tool servers set themselves up" promise on the SHIPPING OS.
  # Windows has a different Node layout (flat zip, node_modules/npm) than the
  # posix tarballs, and the runners always have a system node — so the script
  # forces the managed path that a real user without Node would take.
  nodecheck:
    if: contains(github.event.head_commit.message, '[nodecheck]')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Provision Node + launch a catalog MCP server (no system node used)
        run: node core/scripts/verify-node-runtime.js

  # Agent mode against a REAL 29-tool MCP server, with a model simulated as
  # badly as small local models actually behave (field report v0.27.3: the
  # tool menu overran the 4k context AND mcp:<id>:<tool> names were
  # unspeakable, so the loop silently stopped using tools). Runs everywhere,
  # every push — it needs no network and takes seconds.
  agentcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Replay the agent loop against a 29-tool MCP server
        run: node core/scripts/verify-agent-loop.js
