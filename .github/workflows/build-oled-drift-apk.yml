name: Build OLED Drift APK

on:
  push:
    branches:
      - build/oled-drift-apk
    paths:
      - "oled-drift/**"
      - ".github/workflows/build-oled-drift-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android 35
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: oled-drift
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp oled-drift/app/build/outputs/apk/debug/app-debug.apk OLEDDrift.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OLEDDrift-APK
          path: OLEDDrift.apk
          if-no-files-found: error
