name: Android preview
on:
  workflow_dispatch:
  push:
    branches: ['codex/kai-android-*']
    paths: ['android/**', '.gitmodules', '.github/workflows/android-preview.yml']
  pull_request:
    paths: ['android/**', '.gitmodules', '.github/workflows/android-preview.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Verify catalog and build preview
        working-directory: android
        run: |
          python3 scripts/check-catalog.py
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KAI-Mobile-0.2.1-ARM64-ci-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/screenshots/
            android/app/build/reports/lint-results-debug.*
