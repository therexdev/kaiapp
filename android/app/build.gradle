plugins { id 'com.android.application' }

android {
    namespace 'io.koinosai.mobile'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'io.koinosai.mobile.preview'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview'
        ndk { abiFilters providers.gradleProperty('kaiAbi').getOrElse('arm64-v8a') }
        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'; cppFlags '-std=c++17' }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
