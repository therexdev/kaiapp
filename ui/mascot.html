<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>KAI · Your desktop companion</title>
  <link rel="stylesheet" href="mascot.css">
</head>
<body data-state="idle">
  <main id="companion" aria-label="KAI desktop companion">
    <section id="conversation" class="interactive" aria-label="Talk with KAI" hidden>
      <header class="chat-header">
        <div class="kai-monogram" aria-hidden="true">K</div>
        <div class="chat-heading"><h1>KAI<span>DESKTOP COMPANION</span></h1><p id="connection">Connecting to your app…</p></div>
        <button class="icon-button" id="new-chat" title="New conversation" aria-label="New conversation"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-button" id="collapse" title="Keep KAI on the desktop" aria-label="Collapse conversation"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
      </header>
      <div class="model-row"><span class="status-light"></span><label for="model">Brain</label><select id="model" aria-label="Choose KAI's model"></select><button id="open-models" class="text-button">Manage</button></div>
      <div id="transcript" role="log" aria-label="Conversation">
        <div id="welcome">
          <span class="eyebrow">A LITTLE ROBOT. A LOT OF HELP.</span>
          <h2>Hey, I'm KAI<span>.</span></h2>
          <p>A question, a wild idea, a problem to untangle. I'm right here.</p>
          <div class="suggestions">
            <button data-prompt="Help me plan my day. Start by asking what I need to get done."><span>01</span> Help me plan my day <b>↗</b></button>
            <button data-prompt="Explain something fascinating about how AI works in a simple way."><span>02</span> Teach me something <b>↗</b></button>
            <button data-prompt="Let's brainstorm. Ask me what I'm working on, then help me find a fresh approach."><span>03</span> Let's brainstorm <b>↗</b></button>
          </div>
        </div>
        <div id="messages"></div>
      </div>
      <div id="notice" role="status" hidden></div>
      <div id="voice-setup" hidden><p id="voice-setup-copy"></p><button id="install-voice">Set up voice</button><button id="cancel-voice-setup" class="text-button">Later</button></div>
      <form id="composer">
        <label class="sr-only" for="question">Your message to KAI</label>
        <textarea id="question" rows="2" maxlength="12000" placeholder="Ask KAI anything…" autocomplete="off"></textarea>
        <div class="composer-actions">
          <button type="button" id="mic" class="icon-button" title="Talk to KAI" aria-label="Start voice input" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3M9 21h6"/></svg></button>
          <span id="composer-hint">Enter to send</span>
          <button type="button" id="stop" class="send-button stop-button" aria-label="Stop response" hidden><svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1"/></svg></button>
          <button type="submit" id="send" class="send-button" aria-label="Send message"><svg viewBox="0 0 24 24"><path d="m6 13 6-6 6 6M12 7v12"/></svg></button>
        </div>
      </form>
      <footer class="chat-footer">
        <button id="read-aloud" aria-pressed="false" title="Read KAI's replies aloud"><svg viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4ZM15 8c3 2 3 6 0 8M18 5c5 4 5 10 0 14"/></svg><span>Voice replies off</span></button>
        <button id="main-app">Open full app <span>↗</span></button>
      </footer>
    </section>
    <div id="mascot-stage">
      <div id="status-pill" class="interactive"><span></span><span id="mood-label">Here when you need me</span></div>
      <button id="robot" class="interactive" aria-label="KAI. Click to chat, or drag to move." title="Click to chat · Drag to move"><span id="kai-art" aria-hidden="true"></span></button>
      <div id="mascot-dock" class="interactive">
        <button id="toggle-chat" title="Chat with KAI"><span class="dock-dot"></span><strong>KAI</strong><svg viewBox="0 0 24 24"><path d="M5 5h14v11H9l-4 4Z"/></svg></button>
        <button id="quick-mic" class="icon-button" title="Talk to KAI" aria-label="Talk to KAI"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M6 10v2a6 6 0 0 0 12 0v-2M12 18v3"/></svg></button>
        <button id="mascot-menu-button" class="icon-button" title="KAI options" aria-label="KAI options" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      </div>
      <div id="mascot-menu" class="interactive" hidden>
        <button id="wave">Say hello 👋</button>
        <button id="motion" aria-pressed="true">Animation on</button>
        <button id="menu-open-app">Open full app ↗</button>
        <button id="hide-mascot">Hide KAI to tray</button>
      </div>
    </div>
  </main>
  <script src="markdown.js"></script>
  <script src="audio-wav.js"></script>
  <script src="mascot-client.js"></script>
  <script src="mascot.js"></script>
</body>
</html>
